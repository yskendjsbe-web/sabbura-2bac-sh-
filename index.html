<!-- شريط التفاعل وكتابة الأسئلة أو "راه فهمت" -->
        <div id="studentInteractionBar" class="px-3 sm:px-6 py-2.5 bg-slate-900/95 border-t border-amber-400/25 flex flex-col gap-2">
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
            <span id="comprehensionPrompt" class="text-amber-300 font-bold">
              💬 عندك سؤال ولا شي حاجة ما فهمتيهاش؟ اكتبها هنا، أو اكتب "راه فهمت" باش ندوزو للمرحلة اللي من بعدها.
            </span>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button type="button" id="quickUnderstoodBtn" class="px-3 py-1.5 rounded-lg bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-200 border border-emerald-400/40 font-extrabold transition whitespace-nowrap">
                ✓ راه فهمت (دوز للتالي)
              </button>
              <button type="button" id="quickRepeatBtn" class="px-3 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/35 text-amber-200 border border-amber-400/40 font-bold transition whitespace-nowrap">
                ↻ عاود الشرح
              </button>
            </div>
          </div>

          <form id="studentAskForm" class="flex items-center gap-2 w-full">
            <input
              id="studentInput"
              type="text"
              autocomplete="off"
              placeholder="اكتب هنا: مثلا 'ما فهمتش عوامل النهضة' أو 'راه فهمت' أو 'عاود'..."
              class="flex-1 min-w-0 bg-slate-950 text-white placeholder-slate-400 text-xs sm:text-sm px-3.5 py-2 rounded-xl border border-slate-700 focus:border-amber-400 focus:outline-none"
            />
            <button
              type="submit"
              id="sendStudentMsgBtn"
              class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition flex-shrink-0 whitespace-nowrap"
            >
              <i class="fas fa-paper-plane"></i>
              <span>إرسال</span>
            </button>
          </form>
        </div>
